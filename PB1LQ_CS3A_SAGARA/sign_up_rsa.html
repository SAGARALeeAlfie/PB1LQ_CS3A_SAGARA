<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RSA Sign Up - 3072 Bit</title>
    <link rel="stylesheet" href="sursa.css">
</head>
<body>

    <div class="container">
        <h1>RSA Sign Up</h1>
        <h2>3072-bit Encryption</h2>

        <form id="signupForm">

            <label>Full Name</label>
            <input type="text" id="fullname" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Year Level</label>
            <select id="yearlevel" required>
                <option value="">Select Year Level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Username</label>
            <input type="text" id="username" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit">Encrypt Data</button>
        </form>

        <div class="result">
            <h2>Encryption Result</h2>

            <label>Encrypted Data</label>
            <textarea id="encrypted" readonly></textarea>

            <h2>Decryption Result</h2>

            <label>Decrypted Data</label>
            <textarea id="decrypted" readonly></textarea>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@latest/bin/jsencrypt.min.js"></script>
    <script>
        const RSA_BITS = 3072;
    </script>
    <script src="sursa.js"></script>

</body>
</html>
